<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#25D366" />
  <meta name="description" content="Genera y envía mensajes de WhatsApp personalizados a tus clientes en segundos." />
  <title>Asesor WA</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Asesor WA" />

  <style>
    :root {
      --wa-green: #25D366;
      --wa-dark: #128C7E;
      --bg: #f5f6f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding: 16px;
      padding-bottom: 96px;
    }
    header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }
    header .logo {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--wa-green);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 20px;
    }
    header h1 { font-size: 1.15rem; margin: 0; }
    header p { margin: 0; font-size: 0.8rem; color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .card h2 {
      font-size: 0.95rem; margin: 0 0 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 0.8rem; font-weight: 600;
      margin-bottom: 4px; color: var(--muted);
    }
    .field input, .field textarea {
      width: 100%; padding: 10px 12px;
      font-size: 1rem; font-family: inherit;
      border: 1px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--text);
      transition: border-color .15s;
    }
    .field input:focus, .field textarea:focus {
      outline: none; border-color: var(--wa-green);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }

    .preview {
      background: #e7ffdb;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 60px;
      border-top-right-radius: 4px;
      color: #111;
    }
    .preview:empty::before {
      content: "Aquí verás el mensaje que se enviará…";
      color: var(--muted);
      font-style: italic;
    }
    .preview-wrap { position: relative; }
    .preview-wrap::after {
      content: "✓✓";
      position: absolute; right: 10px; bottom: 6px;
      color: #34b7f1; font-size: 0.75rem;
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      font-family: inherit; font-size: 0.95rem; font-weight: 600;
      border: none; border-radius: 10px; padding: 12px 16px;
      cursor: pointer; transition: transform .05s, filter .15s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--wa-green); color: #fff;
      flex: 1; min-width: 160px;
      box-shadow: 0 2px 6px rgba(37,211,102,0.35);
    }
    .btn-primary:hover { filter: brightness(0.95); }
    .btn-secondary {
      background: #fff; color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost {
      background: transparent; color: var(--wa-dark);
      border: 1px dashed var(--wa-green);
    }
    .btn-install {
      background: var(--wa-dark); color: #fff;
      display: none;
    }

    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .warn { color: var(--danger); font-size: 0.78rem; margin-top: 4px; display: none; }

    .sticky-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(245,246,247,0.95);
      backdrop-filter: blur(6px);
      border-top: 1px solid var(--border);
      display: flex; gap: 10px;
    }
    .sticky-bar .btn-primary { width: 100%; }

    .toast {
      position: fixed; left: 50%; bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      background: #111; color: #fff;
      padding: 10px 16px; border-radius: 20px;
      font-size: 0.85rem; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .oracle-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #166534;
      margin-top: 10px;
      display: none;
    }
    .oracle-box.show { display: block; }
    .oracle-box ul { margin: 6px 0 0; padding-left: 18px; }
    .oracle-box li { margin-bottom: 3px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">💬</div>
    <div>
      <h1>Asesor WA</h1>
      <p>Contacta a tus clientes en segundos</p>
    </div>
    <button class="btn-install" id="btnInstall">⬇️ Instalar</button>
  </header>

  <form id="form" autocomplete="off">
    <section class="card">
      <h2>👤 Datos del cliente</h2>

      <div class="field">
        <label for="nombre">Primer nombre</label>
        <input id="nombre" name="nombre" type="text" placeholder="María" required />
      </div>

      <div class="field">
        <label for="telefono">Teléfono (WhatsApp)</label>
        <input id="telefono" name="telefono" type="tel" inputmode="numeric"
               placeholder="5512345678" required />
        <div class="hint">10 dígitos (MX). Si es otro país, incluye el código.</div>
        <div class="warn" id="telWarn">Ingresa al menos 10 dígitos.</div>
      </div>
    </section>

    <section class="card">
      <h2>💳 Datos de la oferta</h2>

      <div class="field">
        <label for="monto">Monto disponible (MXN)</label>
        <input id="monto" name="monto" type="text" placeholder="67,500.00" required />
      </div>

      <div class="field">
        <label for="vigencia">Vigencia</label>
        <input id="vigencia" name="vigencia" type="text" placeholder="10 de noviembre" required />
      </div>

      <div class="field">
        <label for="folio">Folio (número de cliente)</label>
        <input id="folio" name="folio" type="text" placeholder="B6235935" required />
      </div>
    </section>

    <section class="card">
      <h2>🧑‍💼 Asesor</h2>
      <div class="field">
        <label for="asesor">Tu nombre</label>
        <input id="asesor" name="asesor" type="text" placeholder="Abraham" required />
      </div>
    </section>

    <section class="card">
      <h2>👁️ Simulador (vista previa)</h2>
      <div class="preview-wrap">
        <div class="preview" id="preview"></div>
      </div>

      <div class="actions" style="margin-top:12px;">
        <button type="button" class="btn-ghost" id="btnOracle">🔮 Oráculo</button>
        <button type="button" class="btn-secondary" id="btnCopy">📋 Copiar</button>
      </div>

      <div class="oracle-box" id="oracleBox"></div>
    </section>
  </form>

  <div class="sticky-bar">
    <button type="button" class="btn-primary" id="btnSend">Enviar por WhatsApp</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ========== Utilidades ========== */
    const $ = (id) => document.getElementById(id);
    const STORAGE_KEY = 'asesor-wa-config';

    function mostrarToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* Normaliza el teléfono: solo dígitos. Si son 10 dígitos → prefijo 52 (México). */
    function normalizarTelefono(raw) {
      let d = (raw || '').replace(/\D/g, '');
      // Quita prefijo 1 de USA/Can si llega con 11 dígitos empezando en 1
      if (d.length === 11 && d.startsWith('1')) d = d.slice(1);
      // Si son 10 dígitos, asumimos México → 52
      if (d.length === 10) d = '52' + d;
      // Si son 12 y empiezan en 521 (formato viejo MX), lo dejamos; wa.me lo acepta
      return d;
    }

    function esTelefonoValido(raw) {
      const d = (raw || '').replace(/\D/g, '');
      return d.length >= 10 && d.length <= 15;
    }

    /* ========== Construcción del mensaje ========== */
    function construirMensaje(datos) {
      const { nombre, asesor, monto, vigencia, folio } = datos;
      return `Hola ${nombre} 👋

Soy ${asesor}, asesor de BBVA Tequila.

Tienes disponible un efectivo de hasta $${monto} de tu tarjeta de crédito, vigente hasta el ${vigencia}. (Folio: ${folio})

Si te interesa, con gusto te comparto los detalles y revisamos las opciones juntos.

Quedo atento. ¡Saludos!`;
    }

    /* ========== Lectura del formulario ========== */
    function leerFormulario() {
      return {
        nombre: $('nombre').value.trim(),
        telefono: $('telefono').value.trim(),
        monto: $('monto').value.trim(),
        vigencia: $('vigencia').value.trim(),
        folio: $('folio').value.trim(),
        asesor: $('asesor').value.trim()
      };
    }

    function actualizarPreview() {
      const datos = leerFormulario();
      const faltan = !datos.nombre || !datos.monto || !datos.vigencia || !datos.folio || !datos.asesor;
      $('preview').textContent = faltan ? '' : construirMensaje(datos);

      // Validación visual del teléfono
      const telWarn = $('telWarn');
      telWarn.style.display = (datos.telefono && !esTelefonoValido(datos.telefono)) ? 'block' : 'none';
    }

    /* ========== Acciones ========== */
    function enviarWhatsApp() {
      const datos = leerFormulario();

      if (!datos.nombre || !datos.monto || !datos.vigencia || !datos.folio || !datos.asesor || !datos.telefono) {
        mostrarToast('Completa todos los campos');
        return;
      }
      if (!esTelefonoValido(datos.telefono)) {
        mostrarToast('Teléfono inválido');
        $('telefono').focus();
        return;
      }

      const tel = normalizarTelefono(datos.telefono);
      const texto = encodeURIComponent(construirMensaje(datos));
      const url = `https://wa.me/${tel}?text=${texto}`;

      // Guarda el asesor para la próxima vez
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ asesor: datos.asesor }));

      window.open(url, '_blank');
    }

    async function copiarMensaje() {
      const datos = leerFormulario();
      if (!datos.nombre) { mostrarToast('Completa los datos'); return; }
      const texto = construirMensaje(datos);
      try {
        await navigator.clipboard.writeText(texto);
        mostrarToast('Mensaje copiado ✓');
      } catch {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = texto; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        mostrarToast('Mensaje copiado ✓');
      }
    }

    /* ========== Oráculo: revisa y sugiere mejoras ========== */
    function ejecutarOraculo() {
      const d = leerFormulario();
      const tips = [];

      if (!d.nombre) tips.push('Falta el <b>primer nombre</b> del cliente.');
      if (!d.asesor) tips.push('Falta tu <b>nombre de asesor</b>.');
      if (!d.monto) tips.push('Falta el <b>monto</b>.');
      else if (!/^\d{1,3}(,\d{3})*(\.\d{2})?$/.test(d.monto) && !/^\d+(\.\d{2})?$/.test(d.monto))
        tips.push('El <b>monto</b> no tiene formato tipo 67,500.00.');
      if (!d.vigencia) tips.push('Falta la <b>vigencia</b>.');
      if (!d.folio) tips.push('Falta el <b>folio</b>.');
      if (d.telefono && !esTelefonoValido(d.telefono))
        tips.push('El <b>teléfono</b> parece incompleto (mínimo 10 dígitos).');
      if (d.nombre && d.nombre.length > 12)
        tips.push('El nombre es largo; en WhatsApp se lee mejor el primer nombre solo.');

      const box = $('oracleBox');
      if (tips.length === 0) {
        box.innerHTML = '✨ <b>Todo en orden.</b> El mensaje está listo para enviarse.';
      } else {
        box.innerHTML = '🔮 <b>Sugerencias del oráculo:</b><ul>' +
          tips.map(t => `<li>${t}</li>`).join('') + '</ul>';
      }
      box.classList.add('show');
    }

    /* ========== Restaurar configuración ========== */
    (function restaurar() {
      try {
        const cfg = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (cfg.asesor) $('asesor').value = cfg.asesor;
      } catch {}
    })();

    /* ========== Eventos ========== */
    $('form').addEventListener('input', actualizarPreview);
    $('btnSend').addEventListener('click', enviarWhatsApp);
    $('btnCopy').addEventListener('click', copiarMensaje);
    $('btnOracle').addEventListener('click', ejecutarOraculo);
    $('form').addEventListener('submit', (e) => { e.preventDefault(); enviarWhatsApp(); });

    actualizarPreview();

    /* ========== Instalación PWA ========== */
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $('btnInstall').style.display = 'inline-block';
    });
    $('btnInstall').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      $('btnInstall').style.display = 'none';
    });
    window.addEventListener('appinstalled', () => {
      $('btnInstall').style.display = 'none';
      mostrarToast('App instalada ✓');
    });

    /* ========== Service Worker ========== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
